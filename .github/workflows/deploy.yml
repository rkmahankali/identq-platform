name: Deploy secured blueprint
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the encrypted site
        run: |
          mkdir -p _site
          unzip -q identq-secure-site.zip -d _site
          ls -la _site
      - name: Check before deploy
        run: |
          test -f _site/login.html
          test -f _site/index.html
          test -f _site/assets/keys.json
          test -f _site/assets/gate.js
          test -f _site/data/index.html.enc
          if grep -rlI -e "Requirements baseline" -e "GeoInfoScape" -e "deeprootminds" _site; then echo "Readable blueprint content found, stopping"; exit 1; fi
          echo "Encrypted site checks passed"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
